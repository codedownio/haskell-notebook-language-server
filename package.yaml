name:                haskell-notebook-language-server
version:             0.5.3.3

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5

default-extensions:
- OverloadedStrings
- QuasiQuotes
- NamedFieldPuns
- RecordWildCards
- ScopedTypeVariables
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- ViewPatterns
- MultiParamTypeClasses
- MultiWayIf
- TupleSections
- NumericUnderscores
- TypeApplications

ghc-options:
- -Wunused-packages
- -Wall
- -fno-warn-name-shadowing

library:
  source-dirs: src
  dependencies:
  - containers
  - ghc
  - ghc-parser
  - ihaskell
  - lsp-types >= 2.0.0.1
  - monad-logger
  - notebook-language-server-core
  - pcre-light
  - regex-base
  - regex-pcre-builtin
  - safe
  - string-interpolate
  - text
  - text-rope
  - transformers
  - vector

executables:
  haskell-notebook-language-server:
    main: Main.hs
    source-dirs:
    - app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - aeson
    - attoparsec
    - bytestring
    - ghc
    - haskell-notebook-language-server
    - lens
    - lsp-types >= 2.0.0.1
    - monad-logger
    - mtl
    - notebook-language-server-core
    - optparse-applicative
    - string-interpolate
    - text
    - unix
    - unliftio
    - unliftio-core

tests:
  tests:
    main: Main.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - containers
    - exceptions
    - ghc
    - ghc-paths
    - haskell-notebook-language-server
    - ihaskell
    - lsp-types >= 2.0.0.1
    - monad-logger
    - notebook-language-server-core
    - QuickCheck
    - sandwich
    - sandwich-quickcheck
    - string-interpolate
    - text
    - text-rope
    - transformers
    - unliftio

  test-build:
    main: Main.hs
    source-dirs:
    - test-build
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - sandwich
    - string-interpolate
    - unliftio

benchmarks:
  benchmarks:
    main:                Main.hs
    source-dirs:
    - bench
    ghc-options:
    # Turn off -threaded due to warning from
    # https://hackage.haskell.org/package/weigh
    # - -threaded
    # - -rtsopts
    # - -with-rtsopts=-N
    - -O2
    dependencies:
    - criterion
    - deepseq
    - ghc
    - ghc-parser
    - ghc-paths
    - haskell-notebook-language-server
    - ihaskell
    - lsp-types >= 2.0.0.1
    - myers-diff
    - notebook-language-server-core
    - row-types
    - string-interpolate
    - text-rope
    - transformers
